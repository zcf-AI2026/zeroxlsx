[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeroxlsx"
version = "0.1.0"
description = "Write .xlsx files with zero dependencies — styles, merged cells, column widths and embedded floating images, using only the standard library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zeroxlsx contributors" }]
keywords = ["xlsx", "excel", "spreadsheet", "ooxml", "zero-dependency", "no-dependencies", "image"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]

# Runtime dependencies: none. This is the whole point of the package.
dependencies = []

[project.optional-dependencies]
# openpyxl + Pillow are test-only: they prove the files we write are readable
# by a mainstream library. The package itself imports nothing outside stdlib.
dev = ["pytest>=8", "ruff>=0.6", "openpyxl>=3.1", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/zcf-AI2026/zeroxlsx"
Issues = "https://github.com/zcf-AI2026/zeroxlsx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroxlsx"]

[tool.hatch.build.targets.sdist]
include = ["src/zeroxlsx", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
